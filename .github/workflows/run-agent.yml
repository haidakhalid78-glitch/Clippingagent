name: Autonomous Agent Workflow

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Check Files in Repository
        run: |
          ls -la

      - name: Execute Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "agent.py" ]; then
            python agent.py
          elif [ -f "cleaner_agent.py" ]; then
            python cleaner_agent.py
          else
            echo "Erreur: Aucun fichier agent.py ou cleaner_agent.py trouvé !"
            exit 1
          fi
