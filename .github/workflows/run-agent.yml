name: Agent de clipping autonome

# Tourne automatiquement 2 fois par jour (8h et 20h UTC) — ajustable.
# Se déclenche aussi manuellement depuis l'onglet "Actions" de GitHub.
# Coût : 0 dirham — GitHub Actions est gratuit pour les repos publics
# (et offre ~2000 minutes/mois gratuites pour les repos privés).
on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer l'agent sur chaque transcript en attente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          shopt -s nullglob
          fichiers=(sources/*.txt)
          if [ ${#fichiers[@]} -eq 0 ]; then
            echo "Aucun transcript dans sources/ — rien à faire ce cycle."
            exit 0
          fi
          for f in "${fichiers[@]}"; do
            echo "--- Traitement de $f ---"
            python agent.py "$f"
          done

      - name: Sauvegarder les résultats dans le repo
        run: |
          git config user.name "clipping-agent"
          git config user.email "agent@localhost"
          git add output/ state/ || true
          git diff --cached --quiet || git commit -m "Agent: nouveaux clips proposés [skip ci]"
          git push || true
